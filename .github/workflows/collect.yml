name: 뉴스 수집

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 한국시간 09:00 (GitHub 사정으로 수 분~수십 분 늦을 수 있음)
  workflow_dispatch:       # 대시보드의 '새로 수집' 버튼 → 이 작업을 직접 실행

permissions:
  contents: write          # 수집 결과(data/)를 저장소에 커밋하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 요약용 Claude SDK 설치 (API 키가 있을 때만)
        if: env.HAS_KEY == 'true'
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk

      - name: 뉴스 수집
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/collect.mjs

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "뉴스 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git push
          fi
